version: '3.8'

services:
  newsecurity:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: newsecurity
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - HTTP_PORT=80
      - HTTPS_PORT=443
      - REDIS_URL=redis://redis:6379
      - SSL_EMAIL=admin@example.com
    depends_on:
      - redis
    networks:
      - newsecurity-network
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

  redis:
    image: redis:7-alpine
    container_name: newsecurity-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis-data:/data
    networks:
      - newsecurity-network

  # Optional: Web UI (if you build it separately)
  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   container_name: newsecurity-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:80"
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:80/api
  #   networks:
  #     - newsecurity-network

networks:
  newsecurity-network:
    driver: bridge

volumes:
  redis-data:

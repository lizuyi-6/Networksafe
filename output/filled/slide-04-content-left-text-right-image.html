<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Content-Left-Text-Right-Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1920px;
      height: 1080px;
      background-color: #FFFFFF;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'PingFang TC', 'Hiragino Sans GB', sans-serif;
      position: relative;
      overflow: hidden;
    }
    .title-block {
      position: absolute;
      left: 80px;
      top: 100px;
      width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .title-block [data-slot="title"] {
      font-weight: 600;
      font-size: 64px;
      line-height: 1.22;
      color: #000000;
    }
    .title-block [data-slot="subtitle"] {
      font-weight: 400;
      font-size: 40px;
      line-height: 1.22;
      color: #000000;
      /* 等效灰色（避免 opacity 导出丢失） */
      color: #666666; /* black @ 60% on white */
    }
    .content-blocks {
      position: absolute;
      left: 80px;
      top: 524px;
      width: 800px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .content-block {
      display: flex;
      flex-direction: column;
      gap: 27px;
    }
    .content-block [data-slot^="block"][data-slot$="Heading"] {
      font-weight: 500;
      font-size: 40px;
      line-height: 1.22;
      color: #000000;
    }
    .content-block [data-slot^="block"][data-slot$="Copy"] {
      font-weight: 400;
      font-size: 28px;
      line-height: 1.22;
      color: #000000;
      /* 等效灰色（避免 opacity 导出丢失） */
      color: #4D4D4D; /* black @ 70% on white */
    }
    .right-image {
      position: absolute;
      left: 944px;
      top: 28px;
      width: 948px;
      height: 1024px;
      border-radius: 16px;
      overflow: hidden;
    }
    .right-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="slide" data-template="content-left-text-right-image">
    <div class="title-block">
      <h1 data-slot="title">项目背景与痛点</h1>
      <p data-slot="subtitle">传统安全方案的局限</p>
    </div>
    <div class="content-blocks">
      <div class="content-block">
        <h2 data-slot="block1Heading">攻击手段日益复杂</h2>
        <p data-slot="block1Copy">APT 攻击、0day 漏洞、内部威胁层出不穷，传统防御手段难以应对</p>
      </div>
      <div class="content-block">
        <h2 data-slot="block2Heading">响应速度严重不足</h2>
        <p data-slot="block2Copy">从发现攻击到响应平均需要 280 天，给企业造成巨大损失</p>
      </div>
      <div class="content-block">
        <h2 data-slot="block3Heading">运维成本居高不下</h2>
        <p data-slot="block3Copy">需要大量安全专家进行 7×24 小时监控，中小企业难以承受</p>
      </div>
    </div>
    <div class="right-image">
      <img data-slot="image" src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=800" alt="">
    </div>
  </div>


</body></html>

<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Content-Left-Text-Right-Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1920px;
      height: 1080px;
      background-color: #FFFFFF;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'PingFang TC', 'Hiragino Sans GB', sans-serif;
      position: relative;
      overflow: hidden;
    }
    .title-block {
      position: absolute;
      left: 80px;
      top: 100px;
      width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .title-block [data-slot="title"] {
      font-weight: 600;
      font-size: 64px;
      line-height: 1.22;
      color: #000000;
    }
    .title-block [data-slot="subtitle"] {
      font-weight: 400;
      font-size: 40px;
      line-height: 1.22;
      color: #000000;
      /* 等效灰色（避免 opacity 导出丢失） */
      color: #666666; /* black @ 60% on white */
    }
    .content-blocks {
      position: absolute;
      left: 80px;
      top: 524px;
      width: 800px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .content-block {
      display: flex;
      flex-direction: column;
      gap: 27px;
    }
    .content-block [data-slot^="block"][data-slot$="Heading"] {
      font-weight: 500;
      font-size: 40px;
      line-height: 1.22;
      color: #000000;
    }
    .content-block [data-slot^="block"][data-slot$="Copy"] {
      font-weight: 400;
      font-size: 28px;
      line-height: 1.22;
      color: #000000;
      /* 等效灰色（避免 opacity 导出丢失） */
      color: #4D4D4D; /* black @ 70% on white */
    }
    .right-image {
      position: absolute;
      left: 944px;
      top: 28px;
      width: 948px;
      height: 1024px;
      border-radius: 16px;
      overflow: hidden;
    }
    .right-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="slide" data-template="content-left-text-right-image">
    <div class="title-block">
      <h1 data-slot="title">实时攻击检测</h1>
      <p data-slot="subtitle">基于 AI 的智能分析</p>
    </div>
    <div class="content-blocks">
      <div class="content-block">
        <h2 data-slot="block1Heading">行为分析引擎</h2>
        <p data-slot="block1Copy">基于机器学习的异常行为检测，识别未知威胁</p>
      </div>
      <div class="content-block">
        <h2 data-slot="block2Heading">多维度检测</h2>
        <p data-slot="block2Copy">流量、日志、进程、文件多维数据关联分析</p>
      </div>
      <div class="content-block">
        <h2 data-slot="block3Heading">低误报率</h2>
        <p data-slot="block3Copy">AI 智能降噪，误报率低于 0.1%</p>
      </div>
    </div>
    <div class="right-image">
      <img data-slot="image" src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=800" alt="">
    </div>
  </div>


</body></html>

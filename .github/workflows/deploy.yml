name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    env:
      SERVER_HOST: 39.102.81.78
      DEPLOY_PATH: /opt/aetherguard
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: \${{ secrets.SERVER_HOST }}
          username: \${{ secrets.SERVER_USER }}
          key: \${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Deploying AetherGuard..."
            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH
            git pull origin main || git clone https://github.com/lizuyi-6/Networksafe.git .
            docker compose down || true
            docker compose up -d --build
            docker image prune -f
            echo "✅ Deploy complete!"

      - name: Health Check
        run: |
          sleep 10
          curl -f http://\${{ secrets.SERVER_HOST }}:3005/api/health

      - name: Notify Success
        if: success()
        run: echo "✅ AetherGuard deployed successfully!"

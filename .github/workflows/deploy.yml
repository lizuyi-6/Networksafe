name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_PATH: /opt/networksafe
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Deploying AetherGuard..."
            DEPLOY_PATH=/opt/networksafe
            FRONTEND_PATH=/var/www/aetherguard

            # Clone or update the repository
            if [ -d "$DEPLOY_PATH/.git" ]; then
              cd $DEPLOY_PATH
              git pull origin master
            else
              rm -rf $DEPLOY_PATH
              git clone https://github.com/lizuyi-6/Networksafe.git $DEPLOY_PATH
              cd $DEPLOY_PATH
            fi

            # Build backend
            cd $DEPLOY_PATH/backend
            npm ci --production || npm install --production
            npm run build

            # Restart PM2
            pm2 delete api-security-backend 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            # Deploy frontend
            rm -rf $FRONTEND_PATH
            mkdir -p $FRONTEND_PATH
            cp -r frontend-dist/* $FRONTEND_PATH/

            echo "✅ Deploy complete!"

      - name: Health Check
        run: |
          sleep 15
          curl -f http://${{ secrets.SERVER_HOST }}:8080/api/health

  notify-success:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: 飞书通知 - 部署成功
        uses: foxundermoon/feishu-action@v1
        with:
          url: ${{ secrets.FEISHU_WEBHOOK }}
          title: "✅ AetherGuard 部署成功"
          text: "**AetherGuard 部署成功**\n\n项目: ${{ github.repository }}\n分支: ${{ github.ref_name }}\n提交: ${{ github.sha }}"

  notify-failure:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: 飞书通知 - 部署失败
        uses: foxundermoon/feishu-action@v1
        with:
          url: ${{ secrets.FEISHU_WEBHOOK }}
          title: "❌ AetherGuard 部署失败"
          text: "❌ AetherGuard 部署失败！\n\n项目: ${{ github.repository }}\n分支: ${{ github.ref_name }}\n提交: ${{ github.sha }}\n\n请检查: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

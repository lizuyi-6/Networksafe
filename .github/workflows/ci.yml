name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '18'

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist/

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Run Lint
        run: npm run lint --if-present

  rust-fastpath-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust-fastpath
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Check Fastpath Builds
        run: cargo check --all-targets

      - name: Run Fastpath Tests
        run: cargo test
        continue-on-error: true

      - name: Run Clippy on Fastpath
        run: cargo clippy -- -D warnings

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, rust-fastpath-check]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend.Dockerfile
          push: false
          tags: aetherguard-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aetherguard-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Fastpath Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./rust-fastpath/Dockerfile
          push: false
          tags: aetherguard-fastpath:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  release-verify:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, rust-fastpath-check, docker-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install E2E Dependencies
        run: npm --prefix e2e install

      - name: Install Playwright Browsers
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Run Release Verification Gate
        run: npm run verify:release
        env:
          CI: 'true'
          REDIS_PASSWORD: AetherGuardRedisPassword2026!
          JWT_SECRET: release-verify-jwt-secret-minimum-32-chars
          AUDIT_LOG_SECRET: release-verify-audit-secret-minimum-32
          ADMIN_EMAIL: admin@AetherGuard.com
          ADMIN_PASSWORD: AetherGuardAdminPass2026!

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verify-artifacts
          path: |
            artifacts/release/
            e2e/playwright-report/
            e2e/test-results/

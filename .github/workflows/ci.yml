name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Actions Workflows
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}" \
            --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  project-contracts:
    runs-on: ubuntu-latest
    needs: workflow-lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Project and IDE Contracts
        run: npm run check:project-structure

  frontend-build:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Test i18n Contracts
        run: npm run test:i18n

      - name: Test Credential Hygiene
        run: npm run test:credential-hygiene

      - name: Build
        run: npm run build

      - name: Test Deployment Rollout and Rollback Script
        working-directory: .
        run: bash scripts/release/test-deploy-pm2-release.sh

      - name: Prepare Frontend Build Artifact
        working-directory: .
        run: |
          rm -rf "$RUNNER_TEMP/frontend-artifact"
          mkdir -p "$RUNNER_TEMP/frontend-artifact/dist"
          cp -a frontend/dist/. "$RUNNER_TEMP/frontend-artifact/dist/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/frontend-artifact/SOURCE_SHA"
          test -f "$RUNNER_TEMP/frontend-artifact/dist/index.html"
          test "$(cat "$RUNNER_TEMP/frontend-artifact/SOURCE_SHA")" = "$GITHUB_SHA"

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-artifact/
          if-no-files-found: error
          retention-days: 7

  installer-build:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./installer
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Installer
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test:all

      - name: Run Lint
        run: npm run lint --if-present

  rust-fastpath-check:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./rust-fastpath
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Check Fastpath Builds
        run: cargo check --all-targets

      - name: Run Fastpath Tests
        run: cargo test

      - name: Run Clippy on Fastpath
        run: cargo clippy -- -D warnings

      - name: Build Fastpath Release
        run: cargo build --release

  rescue-check:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./rescue
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Run Rescue Tests
        run: cargo test

      - name: Run Clippy on Rescue
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Rescue Release
        run: cargo build --release

      - name: Run Rescue Fault Drills
        working-directory: .
        run: node scripts/rescue/run-drills.mjs

      - name: Rescue release-capability guard
        working-directory: .
        run: node scripts/guards/check-rescue-no-release.mjs

  gateway-safety-check:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Install Simulator Dependencies
        working-directory: ./simulator
        run: npm ci

      - name: Typecheck Gateway Simulator
        working-directory: ./simulator
        run: npm run typecheck

      - name: Run Gateway Simulator
        working-directory: ./simulator
        run: npm run sim

      - name: Run Fail-Closed Simulator Scenarios
        working-directory: ./simulator
        run: |
          npm run test:invalid-sig
          npm run test:counter-rollback
          npm run test:heartbeat-stale
          npm run test:estop

      - name: Run STM32 Host Tests
        working-directory: ./firmware/controller-stm32h5
        run: make -f test/Makefile test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, rust-fastpath-check]
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend.Dockerfile
          push: false
          tags: aetherguard-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aetherguard-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Fastpath Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./rust-fastpath/Dockerfile
          push: false
          tags: aetherguard-fastpath:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Run Release Guards
        working-directory: .
        run: |
          node scripts/guards/check-route-db-access.mjs
          node scripts/guards/check-no-direct-api-fetch.mjs
          node scripts/guards/check-frontend-api-contract.mjs
          node scripts/guards/check-repository-hygiene.mjs
          node scripts/guards/check-rescue-no-release.mjs

  release-verify:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, installer-build, rust-fastpath-check, rescue-check, gateway-safety-check, docker-build, security-scan]
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E Dependencies
        run: npm --prefix e2e ci

      - name: Install Playwright Browsers
        run: npm --prefix e2e exec playwright install --with-deps chromium

      - name: Run Release Verification Gate
        run: npm run verify:release
        env:
          CI: 'true'
          REDIS_PASSWORD: AetherGuardRedisPassword2026!
          JWT_SECRET: release-verify-jwt-secret-minimum-32-chars
          AUDIT_LOG_SECRET: release-verify-audit-secret-minimum-32
          ADMIN_EMAIL: admin@AetherGuard.com
          ADMIN_PASSWORD: AetherGuardAdminPass2026!

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verify-artifacts
          path: |
            artifacts/release/
            e2e/playwright-report/
            e2e/test-results/

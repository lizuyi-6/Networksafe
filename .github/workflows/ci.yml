name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # ============================================
  # Backend Lint and Test
  # ============================================
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Linter
        run: npm run lint || true  # Allow lint warnings
      
      - name: Run Type Check
        run: npx tsc --noEmit
      
      - name: Run Unit Tests
        run: npm test -- --coverage --passWithNoTests
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-coverage
          path: backend/coverage/

  # ============================================
  # Frontend Build
  # ============================================
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Linter
        run: npm run lint || true
      
      - name: Build Frontend
        run: npm run build
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist/

  # ============================================
  # Docker Build Test
  # ============================================
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend.Dockerfile
          push: false
          tags: fluxguard-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: fluxguard-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Security Scan
  # ============================================
  security-scan:
    runs-on: ubuntu-latest
    needs: backend-test
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      
      - name: Run NPM Audit
        run: cd backend && npm audit --audit-level=high || true
      
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci
      
      - name: Run Frontend NPM Audit
        run: cd frontend && npm audit --audit-level=high || true

  # ============================================
  # Integration Tests (on main only)
  # ============================================
  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      
      - name: Start Backend Server
        run: |
          cd backend
          npm run dev &
          sleep 10
        env:
          REDIS_URL: redis://localhost:6379
          PORT: 3005
      
      - name: Health Check
        run: |
          curl -f http://localhost:3005/api/health || exit 1
      
      - name: Run Integration Tests
        run: |
          cd backend
          npm test -- --testPathPattern="integration" --passWithNoTests

name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Actions Workflows
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}" \
            --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  project-contracts:
    runs-on: ubuntu-latest
    needs: workflow-lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Project and IDE Contracts
        run: npm run check:project-structure

  frontend-build:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Test i18n Contracts
        run: npm run test:i18n

      - name: Test Credential Hygiene
        run: npm run test:credential-hygiene

      - name: Build
        run: npm run build

      - name: Test Deployment Rollout and Rollback Script
        working-directory: .
        run: bash scripts/release/test-deploy-pm2-release.sh

      - name: Test Bare-Metal Rollback Script
        working-directory: .
        run: bash scripts/release/test-bare-metal-rollback.sh

      - name: Test Bare-Metal MinIO Reconciliation
        working-directory: .
        run: bash scripts/release/test-bare-metal-minio.sh

      - name: Prepare Frontend Build Artifact
        working-directory: .
        run: |
          rm -rf "$RUNNER_TEMP/frontend-artifact"
          mkdir -p "$RUNNER_TEMP/frontend-artifact/dist"
          cp -a frontend/dist/. "$RUNNER_TEMP/frontend-artifact/dist/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/frontend-artifact/SOURCE_SHA"
          test -f "$RUNNER_TEMP/frontend-artifact/dist/index.html"
          test "$(cat "$RUNNER_TEMP/frontend-artifact/SOURCE_SHA")" = "$GITHUB_SHA"

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Install Frontend Browser Test Dependencies
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test Default Frontend Route and Session Contracts
        working-directory: .
        env:
          E2E_EXPECT_PITCH_ROUTES_DISABLED: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          # This step serves frontend/dist through `vite preview` with NO backend, so
          # every /api/* call returns 502. The app is fail-closed on that path by design
          # (Login.tsx keeps passwordLoginEnabled false until /api/system/mode confirms
          # it; PrivateRoute renders session-unavailable without /api/auth/me), so tests
          # that must reach a protected route get their session at the network boundary.
          # Scope: these specs may only assert client-side routing/rendering -- they
          # prove NOTHING about backend auth or RBAC. Real login is covered against a
          # real stack by e2e test:release (dev-login.spec.ts, smoke.spec.ts).
          E2E_STATIC_PREVIEW: 'true'
        run: |
          set -euo pipefail
          # Pass `frontend` as the positional root so vite resolves vite.config.ts + dist/ from
          # frontend/ (this step runs with working-directory=. at repo root; without the root arg
          # vite serves ./dist which does not exist and returns 404 for every path, making the
          # readiness curl --fail fail forever - a 404, NOT a slow startup).
          frontend/node_modules/.bin/vite preview frontend --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/default-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT
          # Bounded readiness wait (<=60s, 0.5s poll). Fail IMMEDIATELY with logs if the preview
          # process dies before becoming ready; print the full log + the actual HTTP status code
          # on timeout (so a 404 mislabeled as "slow startup" is self-diagnosing). No fixed sleep,
          # no infinite retry, no || true on the readiness check, E2E is never skipped.
          ready=0
          for _ in $(seq 1 120); do
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              echo "vite preview process exited early before becoming ready; full log:" >&2
              cat "$RUNNER_TEMP/default-preview.log" >&2
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "vite preview did not become ready within 60s; full log:" >&2
            cat "$RUNNER_TEMP/default-preview.log" >&2
            # Probe the actual HTTP status so a 404 (wrong root) vs 000 (not listening) is visible,
            # not just the banner-only log that hides the real failure mode.
            probe=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173/ 2>/dev/null || echo "curl-failed")
            echo "readiness probe http_code for GET / = $probe (200=ok; 404=wrong root/no dist; 000=not listening)" >&2
            exit 1
          fi
          npm --prefix e2e run test -- tests/site-walkthrough.spec.ts --project=chromium --grep pitch-disabled
          npm --prefix e2e run test -- tests/security-hardening-acceptance.spec.ts --project=chromium --grep "header health|mounted admin|hanging session|hanging refresh|enterprise read-permission matrix"
          npm --prefix e2e run test -- tests/frontend-interaction-boundaries.spec.ts --project=chromium
          kill "$PREVIEW_PID" 2>/dev/null || true
          wait "$PREVIEW_PID" 2>/dev/null || true
          trap - EXIT

      - name: Build Pitch-Enabled Route Variant
        env:
          VITE_ENABLE_PITCH_ROUTES: 'true'
        run: npm run build

      - name: Test Pitch-Enabled Public Routes
        working-directory: .
        env:
          E2E_EXPECT_PITCH_ROUTES: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          # Pass `frontend` as the positional root (see default-route step for rationale).
          frontend/node_modules/.bin/vite preview frontend --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/pitch-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT
          # Bounded readiness wait (<=60s, 0.5s poll). Fail IMMEDIATELY with logs if the preview
          # process dies before becoming ready; print the full log + actual HTTP status on timeout.
          ready=0
          for _ in $(seq 1 120); do
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              echo "vite preview process exited early before becoming ready; full log:" >&2
              cat "$RUNNER_TEMP/pitch-preview.log" >&2
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4173/aetherguard-deck > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "vite preview did not become ready within 60s; full log:" >&2
            cat "$RUNNER_TEMP/pitch-preview.log" >&2
            probe=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173/aetherguard-deck 2>/dev/null || echo "curl-failed")
            echo "readiness probe http_code for GET /aetherguard-deck = $probe (200=ok; 404=wrong root/no dist; 000=not listening)" >&2
            exit 1
          fi
          npm --prefix e2e run test -- tests/site-walkthrough.spec.ts --project=chromium --grep pitch-enabled
          kill "$PREVIEW_PID" 2>/dev/null || true
          wait "$PREVIEW_PID" 2>/dev/null || true
          trap - EXIT

  installer-build:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./installer
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Installer
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test:all

      - name: Run Lint
        run: npm run lint --if-present

  rust-fastpath-check:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./rust-fastpath
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Check Fastpath Builds
        run: cargo check --all-targets

      - name: Run Fastpath Tests
        run: cargo test

      - name: Run Clippy on Fastpath
        run: cargo clippy -- -D warnings

      - name: Build Fastpath Release
        run: cargo build --release

  rescue-check:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./rescue
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Run Rescue Tests
        run: cargo test

      - name: Run Clippy on Rescue
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Rescue Release
        run: cargo build --release

      - name: Run Rescue Fault Drills
        working-directory: .
        run: node scripts/rescue/run-drills.mjs

      - name: Rescue release-capability guard
        working-directory: .
        run: node scripts/guards/check-rescue-no-release.mjs

  gateway-safety-check:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Install Simulator Dependencies
        working-directory: ./simulator
        run: npm ci

      - name: Typecheck Gateway Simulator
        working-directory: ./simulator
        run: npm run typecheck

      - name: Run Gateway Simulator
        working-directory: ./simulator
        run: npm run sim

      - name: Run Fail-Closed Simulator Scenarios
        working-directory: ./simulator
        run: |
          npm run test:invalid-sig
          npm run test:counter-rollback
          npm run test:heartbeat-stale
          npm run test:estop

      - name: Run STM32 Host Tests
        working-directory: ./firmware/controller-stm32h5
        run: make -f test/Makefile test

  challenge-dataset-check:
    runs-on: ubuntu-latest
    needs: project-contracts
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./ml/data/lan_challenge_capture
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ml/data/lan_challenge_capture/package-lock.json

      - name: Install validation dependencies (self-contained AJV)
        run: npm ci

      - name: "Verify dataset (fail-closed: schema + semantic + privacy + label-isolation + alignment)"
        run: node verify.js

      - name: Run challenge-capture test suite (partial-fragment / whitelist / schema-rejection)
        run: node test/run-tests.js

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, rust-fastpath-check]
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend.Dockerfile
          push: false
          tags: aetherguard-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aetherguard-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Fastpath Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./rust-fastpath/Dockerfile
          push: false
          tags: aetherguard-fastpath:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Run Release Guards
        working-directory: .
        run: npm run check:release-guards

  release-verify:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, installer-build, rust-fastpath-check, rescue-check, gateway-safety-check, docker-build, security-scan, challenge-dataset-check]
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E Dependencies
        run: npm --prefix e2e ci

      - name: Install Playwright Browsers
        run: npm --prefix e2e exec playwright install --with-deps chromium

      - name: Run Release Verification Gate
        run: npm run verify:release
        env:
          CI: 'true'
          # DP-007 fix (audit 2026-08): was four hardcoded literal test
          # secrets visible to every fork and prone to copy-paste reuse
          # (they also sat outside the weak-value guard's literal set).
          # CI-only random values now: no reusable literal in the repo, and
          # the generated values still satisfy the min-length checks.
          REDIS_PASSWORD: ci-${{ github.run_id }}-redis-password-32chars-min
          JWT_SECRET: ci-${{ github.run_id }}-jwt-secret-minimum-32-chars
          AUDIT_LOG_SECRET: ci-${{ github.run_id }}-audit-secret-minimum-32
          ADMIN_EMAIL: admin@AetherGuard.com
          ADMIN_PASSWORD: ci-${{ github.run_id }}-admin-pass-32chars-min!

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verify-artifacts
          path: |
            artifacts/release/
            e2e/playwright-report/
            e2e/test-results/

[package]
name = "ag-rescue"
version = "0.1.0"
edition = "2021"
description = "AetherGuard heterogeneous rescue control plane (safe-side actions only; no release capability by design)"

[lib]
name = "ag_rescue"
path = "src/lib.rs"

[[bin]]
name = "ag-rescue"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"
getrandom = "0.2"

[profile.release]
lto = true
codegen-units = 1

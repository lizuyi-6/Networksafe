<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    .title { font: 700 28px sans-serif; fill: #111; }
    .label { font: 18px sans-serif; fill: #111; }
    .small { font: 14px sans-serif; fill: #333; }
    .dim { font: 14px monospace; fill: #111; }
    .body { fill: #111; stroke: #444; stroke-width: 3; }
    .cut { fill: #e8f7ff; stroke: #2a6f8f; stroke-width: 2; }
    .metal { fill: #d9d9d9; stroke: #555; stroke-width: 2; }
    .accent { fill: #37c871; stroke: #116a35; stroke-width: 2; }
    .btn { fill: #2d2d2d; stroke: #aaa; stroke-width: 2; }
    .line { stroke: #111; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dimline { stroke: #111; stroke-width: 1.5; fill: none; marker-start: url(#bar); marker-end: url(#bar); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <marker id="bar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M4,0 L4,8" stroke="#111" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="48" y="50" class="title">AetherGuard Serial Deployer EV1 - factory layout reference</text>
  <text x="48" y="82" class="small">Status: factory-draft. Dimensions in millimeters. Use OpenSCAD source for generated solids.</text>

  <text x="80" y="135" class="label">Top view</text>
  <rect x="80" y="160" width="560" height="361" rx="38" class="body"/>
  <rect x="125" y="195" width="470" height="295" rx="28" class="cut"/>
  <rect x="230" y="275" width="145" height="76" rx="10" fill="#0b1b22" stroke="#75d7ff" stroke-width="3"/>
  <text x="250" y="318" class="small" fill="#75d7ff">OLED window</text>
  <circle cx="465" cy="313" r="17" class="accent"/>
  <text x="493" y="319" class="small">RGB</text>
  <circle cx="250" cy="468" r="17" class="btn"/>
  <circle cx="360" cy="468" r="17" class="btn"/>
  <circle cx="470" cy="468" r="17" class="btn"/>
  <text x="214" y="545" class="small">front buttons: OK / NEXT / BACK</text>
  <line x1="80" y1="545" x2="640" y2="545" class="dimline"/>
  <text x="319" y="571" class="dim">90.0</text>
  <line x1="665" y1="160" x2="665" y2="521" class="dimline"/>
  <text x="681" y="348" class="dim">58.0</text>

  <text x="760" y="135" class="label">Rear view</text>
  <rect x="760" y="180" width="340" height="92" rx="24" class="body"/>
  <rect x="910" y="210" width="54" height="24" rx="7" class="metal"/>
  <text x="889" y="299" class="small">USB-C service/debug/power</text>
  <line x1="930" y1="236" x2="910" y2="286" class="line"/>
  <line x1="760" y1="304" x2="1100" y2="304" class="dimline"/>
  <text x="911" y="330" class="dim">90.0</text>
  <line x1="1125" y1="180" x2="1125" y2="272" class="dimline"/>
  <text x="1140" y="231" class="dim">16.8</text>

  <text x="760" y="395" class="label">Right side view</text>
  <rect x="760" y="420" width="340" height="92" rx="24" class="body"/>
  <rect x="1026" y="476" width="55" height="20" rx="7" fill="#222" stroke="#aaa" stroke-width="2"/>
  <path d="M1080 486 C1120 487, 1145 505, 1162 528" stroke="#111" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M1080 486 C1120 487, 1145 505, 1162 528" stroke="#444" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text x="830" y="548" class="small">right rear lower USB-A pigtail exit</text>
  <line x1="1038" y1="495" x2="900" y2="536" class="line"/>

  <text x="80" y="650" class="label">Manufacturing notes</text>
  <text x="80" y="681" class="small">1. Keep rear USB-C centered and flush with the enclosure opening.</text>
  <text x="80" y="706" class="small">2. Keep OLED, RGB, and buttons aligned to the top/front user interface features.</text>
  <text x="80" y="731" class="small">3. Cable exit requires strain relief in final prototype assembly.</text>
</svg>


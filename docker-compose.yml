services:

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-aetherguard}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-aetherguard} ${S3_SECRET_KEY:?S3_SECRET_KEY is required}; do sleep 2; done &&
      mc mb --ignore-existing local/${S3_BUCKET:-aetherguard-artifacts} &&
      mc mb --ignore-existing --with-lock local/${AUDIT_ARCHIVE_BUCKET:-aetherguard-audit-lock} &&
      mc retention set --default COMPLIANCE 30d local/${AUDIT_ARCHIVE_BUCKET:-aetherguard-audit-lock} &&
      mc retention info --default local/${AUDIT_ARCHIVE_BUCKET:-aetherguard-audit-lock}
      "

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aetherguard}
      - POSTGRES_USER=${POSTGRES_USER:-aetherguard}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetherguard} -d ${POSTGRES_DB:-aetherguard}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  fastpath:
    build:
      context: .
      dockerfile: rust-fastpath/Dockerfile
    environment:
      - FASTPATH_TRANSPORT=${FASTPATH_TRANSPORT:-unix}
      - FASTPATH_SOCKET_PATH=${FASTPATH_SOCKET_PATH:-/var/run/aetherguard-fastpath/aetherguard-fastpath.sock}
      - RUST_LOG=${FASTPATH_LOG_LEVEL:-info}
      - FASTPATH_AUTH_SECRET=${FASTPATH_AUTH_SECRET:?FASTPATH_AUTH_SECRET is required}
    volumes:
      - fastpath_run:/var/run/aetherguard-fastpath
    healthcheck:
      test: [ "CMD", "aetherguard-fastpath", "self-check" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      # DP-014 fix (audit 2026-08): was `dockerfile: backend.Dockerfile`
      # (root) — only backend/Dockerfile exists, so a fresh checkout
      # `docker compose build` failed. Build with backend/ as the context so
      # its Dockerfile-relative COPY paths resolve.
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3005
      - BACKEND_BIND_ADDRESS=0.0.0.0
      - PROFILE=${PROFILE:-prod}
      - APP_ROLE=${APP_ROLE:-all}
      - DB_MODE=${DB_MODE:-postgres}
      - ARTIFACT_STORE=${ARTIFACT_STORE:-s3}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DATA_DIR=/app/data
      - ARTIFACTS_DIR=/app/artifacts
      - APP_MODE=production
      - ENTERPRISE_RUNTIME_MODE=${ENTERPRISE_RUNTIME_MODE:-prod-enterprise}
      - ALLOW_LOCAL_PASSWORD_LOGIN=${ALLOW_LOCAL_PASSWORD_LOGIN:-true}
      - ALLOW_BREAK_GLASS_PASSWORD_LOGIN=${ALLOW_BREAK_GLASS_PASSWORD_LOGIN:-false}
      - ALLOW_DEMO_FEATURES=${ALLOW_DEMO_FEATURES:-false}
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      - DEMO_AUTO_SEED=false
      - ENABLE_ATTACK_SIM=${ENABLE_ATTACK_SIM:-false}
      - ENABLE_DEV_LOGIN_PRESETS=${ENABLE_DEV_LOGIN_PRESETS:-false}
      - ENABLE_RUNTIME_EMULATOR=${ENABLE_RUNTIME_EMULATOR:-false}
      - SQLITE_FALLBACK_ENABLED=${SQLITE_FALLBACK_ENABLED:-false}
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SHADOW_DATABASE_URL=${SHADOW_DATABASE_URL:?SHADOW_DATABASE_URL is required}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-aetherguard-artifacts}
      - AUDIT_ARCHIVE_BUCKET=${AUDIT_ARCHIVE_BUCKET:-aetherguard-audit-lock}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-aetherguard}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      - FASTPATH_URL=${FASTPATH_URL:-http://fastpath:8081}
      - FASTPATH_TRANSPORT=${FASTPATH_TRANSPORT:-unix}
      - FASTPATH_SOCKET_PATH=${FASTPATH_SOCKET_PATH:-/var/run/aetherguard-fastpath/aetherguard-fastpath.sock}
      - FASTPATH_AUTH_SECRET=${FASTPATH_AUTH_SECRET:?FASTPATH_AUTH_SECRET is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AUDIT_LOG_SECRET=${AUDIT_LOG_SECRET:?AUDIT_LOG_SECRET is required}
      - AUDIT_LOG_FAIL_CLOSED=${AUDIT_LOG_FAIL_CLOSED:-true}
      - AUDIT_SHADOW_REQUIRED=${AUDIT_SHADOW_REQUIRED:-true}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (min 12 chars)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@AetherGuard.com}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (min 32 chars)}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT:?ENCRYPTION_SALT is required (min 16 chars)}
      - VALID_API_KEYS=${VALID_API_KEYS:-}
      - DEVICE_API_KEYS=${DEVICE_API_KEYS:?DEVICE_API_KEYS is required}
      - DEVICE_COMMAND_SECRET=${DEVICE_COMMAND_SECRET:?DEVICE_COMMAND_SECRET is required}
      - SERIAL_HELPER_SHARED_SECRET=${SERIAL_HELPER_SHARED_SECRET:?SERIAL_HELPER_SHARED_SECRET is required and must differ from DEVICE_COMMAND_SECRET}
      - PLATFORM_API_PROTOCOL=${PLATFORM_API_PROTOCOL:-openai-compatible}
      - PLATFORM_API_BASE_URL=${PLATFORM_API_BASE_URL:-https://coding.dashscope.aliyuncs.com/v1}
      - PLATFORM_API_TIMEOUT=${PLATFORM_API_TIMEOUT:-120000}
    volumes:
      # Persist SQLite database and scan results across restarts
      - backend_data:/app/data
      - scan_results:/app/scan-results
      - artifacts_data:/app/artifacts
      - fastpath_run:/var/run/aetherguard-fastpath
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fastpath:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Frontend (Nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/index.html" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ─────────────────────────────────────────────
# Named Volumes (data persists across container restarts)
# ─────────────────────────────────────────────
volumes:
  redis_data:
  backend_data:
  scan_results:
  artifacts_data:
  minio_data:
  postgres_data:
  fastpath_run:

services:

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-aetherguard}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-AetherGuardArtifactSecret2026}
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-aetherguard} ${S3_SECRET_KEY:-AetherGuardArtifactSecret2026}; do sleep 2; done &&
      mc mb --ignore-existing local/${S3_BUCKET:-aetherguard-artifacts} &&
      mc mb --ignore-existing --with-lock local/${AUDIT_ARCHIVE_BUCKET:-aetherguard-audit-lock} &&
      mc retention set --default COMPLIANCE 30d local/${AUDIT_ARCHIVE_BUCKET:-aetherguard-audit-lock} &&
      mc retention info --default local/${AUDIT_ARCHIVE_BUCKET:-aetherguard-audit-lock}
      "

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aetherguard}
      - POSTGRES_USER=${POSTGRES_USER:-aetherguard}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-AetherGuardPgShadow2026}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetherguard} -d ${POSTGRES_DB:-aetherguard}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  fastpath:
    build:
      context: .
      dockerfile: rust-fastpath/Dockerfile
    environment:
      - FASTPATH_TRANSPORT=${FASTPATH_TRANSPORT:-unix}
      - FASTPATH_SOCKET_PATH=${FASTPATH_SOCKET_PATH:-/var/run/aetherguard-fastpath/aetherguard-fastpath.sock}
      - RUST_LOG=${FASTPATH_LOG_LEVEL:-info}
    volumes:
      - fastpath_run:/var/run/aetherguard-fastpath
    healthcheck:
      test: [ "CMD", "aetherguard-fastpath", "self-check" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-3005}:3005"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3005
      - PROFILE=${PROFILE:-prod}
      - APP_ROLE=${APP_ROLE:-all}
      - DB_MODE=${DB_MODE:-postgres}
      - ARTIFACT_STORE=${ARTIFACT_STORE:-s3}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DATA_DIR=/app/data
      - ARTIFACTS_DIR=/app/artifacts
      - APP_MODE=production
      - DEMO_AUTO_SEED=false
      - ENABLE_ATTACK_SIM=true
      - ENABLE_DEV_LOGIN_PRESETS=true
      - ENABLE_RUNTIME_EMULATOR=${ENABLE_RUNTIME_EMULATOR:-false}
      - SQLITE_FALLBACK_ENABLED=${SQLITE_FALLBACK_ENABLED:-true}
      - DATABASE_URL=${DATABASE_URL:-}
      - SHADOW_DATABASE_URL=${SHADOW_DATABASE_URL:-postgres://aetherguard:AetherGuardPgShadow2026@postgres:5432/aetherguard}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-aetherguard-artifacts}
      - AUDIT_ARCHIVE_BUCKET=${AUDIT_ARCHIVE_BUCKET:-aetherguard-audit-lock}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-aetherguard}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-AetherGuardArtifactSecret2026}
      - FASTPATH_URL=${FASTPATH_URL:-http://fastpath:8081}
      - FASTPATH_TRANSPORT=${FASTPATH_TRANSPORT:-unix}
      - FASTPATH_SOCKET_PATH=${FASTPATH_SOCKET_PATH:-/var/run/aetherguard-fastpath/aetherguard-fastpath.sock}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AUDIT_LOG_SECRET=${AUDIT_LOG_SECRET:?AUDIT_LOG_SECRET is required}
      - VALID_API_KEYS=${VALID_API_KEYS:-}
      - DEVICE_API_KEYS=${DEVICE_API_KEYS:-dev-device-key-2026}
      - DEVICE_COMMAND_SECRET=${DEVICE_COMMAND_SECRET:-AetherGuardDeviceCommandSecret2026}
      - PLATFORM_API_PROTOCOL=${PLATFORM_API_PROTOCOL:-openai-compatible}
      - PLATFORM_API_BASE_URL=${PLATFORM_API_BASE_URL:-https://coding.dashscope.aliyuncs.com/v1}
      - PLATFORM_API_TIMEOUT=${PLATFORM_API_TIMEOUT:-120000}
    volumes:
      # Persist SQLite database and scan results across restarts
      - backend_data:/app/data
      - scan_results:/app/scan-results
      - artifacts_data:/app/artifacts
      - fastpath_run:/var/run/aetherguard-fastpath
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fastpath:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Frontend (Nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/index.html" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ─────────────────────────────────────────────
# Named Volumes (data persists across container restarts)
# ─────────────────────────────────────────────
volumes:
  redis_data:
  backend_data:
  scan_results:
  artifacts_data:
  minio_data:
  postgres_data:
  fastpath_run:

{
    "env:esp32dev": {
        "platform": "espressif32",
        "board": "esp32dev",
        "framework": "arduino",
        "monitor_speed": 115200,
        "lib_deps": [
            "bblanchon/ArduinoJson@^6.21.0",
            "256dpi/MQTT@^2.5.1",
            "ESP32 BLE Arduino"
        ],
        "build_flags": [
            "-DCORE_DEBUG_LEVEL=3",
            "-DBOARD_HAS_PSRAM"
        ]
    }
}

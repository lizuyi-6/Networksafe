[platformio]
default_envs = serial_deployer_release

[env:serial_deployer]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.15
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DENABLE_DEBUG=1
build_src_filter =
  +<main.cpp>

[env:serial_deployer_release]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.15
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DENABLE_DEBUG=0
build_src_filter =
  +<main.cpp>

[env:serial_deployer_pcb_v1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.15
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DENABLE_DEBUG=0
  -DAG_HW_PROFILE_PCB_V1=1
build_src_filter =
  +<main.cpp>

[env:experimental_cloud_smoke]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DENABLE_DEBUG=0
  -DENABLE_EXPERIMENTAL_CLOUD=1
build_src_filter =
  +<experimental_main.cpp>

server {
    listen 80;
    server_name AetherGuardpro.top www.AetherGuardpro.top;

    # Map ACME challenge to standard webroot to avoid permission issues
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        root /var/www/AetherGuard/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    location /api {
       proxy_pass http://localhost:8080;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection 'upgrade';
       proxy_set_header Host $host;
       proxy_cache_bypass $http_upgrade;
   }
}

server {
    listen 443 ssl;
    server_name AetherGuardpro.top www.AetherGuardpro.top;

    ssl_certificate /etc/letsencrypt/live/AetherGuardpro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AetherGuardpro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/AetherGuard/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

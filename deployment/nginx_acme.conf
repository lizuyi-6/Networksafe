server {
    listen 80;
    server_name AetherGuardpro.top www.AetherGuardpro.top;

    # Important for Certbot webroot validation
    location /.well-known/acme-challenge/ {
        root /var/www/AetherGuard/frontend;
    }

    location / {
        # Optional: Redirect to HTTPS, but only after we confirm validation works.
        # For now, let's keep it simple and serve the app.
        root /var/www/AetherGuard/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
   location /api {
       proxy_pass http://localhost:8080;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection 'upgrade';
       proxy_set_header Host $host;
       proxy_cache_bypass $http_upgrade;
   }

   location /health/ {
       proxy_pass http://localhost:8080;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
   }
}

server {
    listen 443 ssl;
    server_name AetherGuardpro.top www.AetherGuardpro.top;

    # Current certs (only valid for @, invalid for www yet, but Nginx will start)
    ssl_certificate /etc/letsencrypt/live/AetherGuardpro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AetherGuardpro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/AetherGuard/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /health/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

version: '3.8'

networks:
  fluxguard-network:
    driver: bridge

volumes:
  redis-data:
  backend-data:

services:
  redis:
    image: redis:7-alpine
    container_name: fluxguard-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-fluxguard_redis_secret_2024}
    volumes:
      - redis-data:/data
    networks:
      - fluxguard-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fluxguard_redis_secret_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: fluxguard-backend
    restart: unless-stopped
    ports:
      - "3010:3005"
    environment:
      - NODE_ENV=production
      - APP_MODE=production
      - DEMO_AUTO_SEED=false
      - ENABLE_ATTACK_SIM=false
      - DATA_DIR=/app/data/prod
      - PORT=3005
      - REDIS_URL=redis://:${REDIS_PASSWORD:-fluxguard_redis_secret_2024}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-fluxguard_jwt_secret_production_2024_minimum_32_chars}
      - AUDIT_LOG_SECRET=${AUDIT_LOG_SECRET:-fluxguard_audit_secret_production_2024_32chars}
      - DATABASE_PATH=/app/data/production.db
      - DISABLE_REDIS=false
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3005,http://localhost:8888,http://frontend,http://nginx
      - AGENT_API_KEY=${AGENT_API_KEY:-probe_agent_production_key_32_characters}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_URL=${DASHSCOPE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - AI_CLOUD_MODEL=${AI_CLOUD_MODEL:-qwen3-coder-480b-a35b-instruct}
    volumes:
      - backend-data:/app/data
    networks:
      - fluxguard-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployment/production/frontend.Dockerfile
    container_name: fluxguard-frontend
    restart: unless-stopped
    ports:
      - "8888:80"
    networks:
      - fluxguard-network
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  probe-agent:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    container_name: fluxguard-probe-agent
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3005
      - AGENT_ID=probe-agent-01
      - HOSTNAME=fluxguard-probe
      - AGENT_API_KEY=probe_agent_production_key_32_characters
      - HEARTBEAT_INTERVAL=30000
      - METRICS_INTERVAL=10000
    networks:
      - fluxguard-network
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

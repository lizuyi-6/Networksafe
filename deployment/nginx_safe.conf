server {
    listen 80;
    server_name fluxguardpro.top www.fluxguardpro.top;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        root /var/www/fluxguard/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name fluxguardpro.top www.fluxguardpro.top;

    # Force allow ACME challenge, overriding any global hidden file blocks
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/fluxguard/frontend;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        root /var/www/fluxguard/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    location /api {
       proxy_pass http://localhost:8080;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection 'upgrade';
       proxy_set_header Host $host;
       proxy_cache_bypass $http_upgrade;
   }
}

server {
    listen 443 ssl;
    server_name fluxguardpro.top www.fluxguardpro.top;

    ssl_certificate /etc/letsencrypt/live/fluxguardpro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluxguardpro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fluxguard/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

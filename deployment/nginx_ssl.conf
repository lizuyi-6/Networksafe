server {
    listen 80;
    server_name AetherGuardpro.top www.AetherGuardpro.top;
    
    # Allow ACME challenge for renewal
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/AetherGuard/frontend;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name AetherGuardpro.top www.AetherGuardpro.top;

    ssl_certificate /etc/letsencrypt/live/AetherGuardpro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AetherGuardpro.top/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/AetherGuard/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy Configuration
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /health/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

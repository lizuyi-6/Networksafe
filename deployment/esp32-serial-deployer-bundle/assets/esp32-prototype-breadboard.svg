<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 serial deployer jumper prototype breadboard view</title>
  <desc id="desc">Two-panel breadboard-style diagram showing deployment mode and fallback flash mode for the ESP32 serial deployer prototype.</desc>
  <defs>
    <style>
      .bg { fill: #f3f4f6; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panel-title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .panel-subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .board { fill: #fcfcfc; stroke: #d6dbe3; stroke-width: 2; }
      .module-dark { fill: #16324f; stroke: #0f172a; stroke-width: 2; }
      .module-mid { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .module-warm { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .module-cool { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .module-muted { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
      .screen { fill: #111827; stroke: #22c55e; stroke-width: 2; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .micro { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .pin { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .note-text { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .legend-label { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .wire-power { stroke: #dc2626; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-ground { stroke: #0f172a; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-i2c { stroke: #2563eb; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-gpio { stroke: #16a34a; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-uart2 { stroke: #f59e0b; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-uart0 { stroke: #7c3aed; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-usb { stroke: #0891b2; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-disabled { stroke: #94a3b8; stroke-width: 4; fill: none; stroke-dasharray: 10 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1080"/>
  <text x="800" y="52" text-anchor="middle" class="panel-title">ESP32 Serial Deployer Prototype</text>
  <text x="800" y="82" text-anchor="middle" class="panel-subtitle">Left: deployment mode on UART2. Right: fallback flash mode on UART0. Diagram is spaced for readability and is not to scale.</text>

  <g id="deployment-panel">
    <rect class="panel" x="40" y="110" width="740" height="840" rx="20"/>
    <text x="70" y="154" class="panel-title">Deployment Mode</text>
    <text x="70" y="180" class="panel-subtitle">Separated routing lanes for power, I2C, buttons, lower GPIO, and UART2.</text>

    <rect class="board" x="70" y="215" width="680" height="700" rx="18"/>
    <line x1="390" y1="240" x2="390" y2="890" stroke="#e5e7eb" stroke-width="8"/>
    <line x1="398" y1="240" x2="398" y2="890" stroke="#e5e7eb" stroke-width="8"/>

    <rect class="module-dark" x="210" y="300" width="190" height="410" rx="18"/>
    <text x="305" y="338" text-anchor="middle" class="label" fill="#f8fafc">ESP32 Dev Board</text>
    <text x="305" y="362" text-anchor="middle" class="small" fill="#e2e8f0">Board USB preferred for flash/debug</text>
    <rect x="252" y="386" width="106" height="124" rx="8" fill="#1f2937" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="305" y="452" text-anchor="middle" class="small" fill="#dbeafe">ESP32-WROOM-32</text>
    <rect x="270" y="652" width="70" height="28" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="305" y="671" text-anchor="middle" class="tiny" fill="#f8fafc">USB</text>

    <circle class="pin" cx="210" cy="380" r="5"/>
    <circle class="pin" cx="210" cy="420" r="5"/>
    <circle class="pin" cx="210" cy="460" r="5"/>
    <circle class="pin" cx="210" cy="500" r="5"/>
    <circle class="pin" cx="210" cy="540" r="5"/>
    <circle class="pin" cx="210" cy="580" r="5"/>
    <circle class="pin" cx="210" cy="620" r="5"/>
    <circle class="pin" cx="210" cy="660" r="5"/>
    <circle class="pin" cx="400" cy="420" r="5"/>
    <circle class="pin" cx="400" cy="470" r="5"/>
    <circle class="pin" cx="400" cy="520" r="5"/>
    <circle class="pin" cx="400" cy="580" r="5"/>
    <circle class="pin" cx="400" cy="630" r="5"/>
    <circle class="pin" cx="400" cy="680" r="5"/>

    <text x="182" y="384" text-anchor="end" class="tiny">3V3</text>
    <text x="182" y="424" text-anchor="end" class="tiny">GND</text>
    <text x="182" y="464" text-anchor="end" class="tiny">GPIO21</text>
    <text x="182" y="504" text-anchor="end" class="tiny">GPIO22</text>
    <text x="182" y="544" text-anchor="end" class="tiny">GPIO16</text>
    <text x="182" y="584" text-anchor="end" class="tiny">GPIO17</text>
    <text x="182" y="624" text-anchor="end" class="tiny">GPIO14</text>
    <text x="182" y="664" text-anchor="end" class="tiny">GPIO3</text>
    <text x="430" y="424" class="tiny">GPIO18</text>
    <text x="430" y="474" class="tiny">GPIO19</text>
    <text x="430" y="524" class="tiny">GPIO23</text>
    <text x="430" y="584" class="tiny">GPIO25</text>
    <text x="430" y="634" class="tiny">GPIO26</text>
    <text x="430" y="684" class="tiny">GPIO27</text>

    <rect class="module-mid" x="515" y="245" width="160" height="136" rx="14"/>
    <rect class="screen" x="535" y="262" width="120" height="48" rx="6"/>
    <text x="595" y="292" text-anchor="middle" class="small" fill="#bbf7d0">OLED I2C</text>
    <text x="595" y="326" text-anchor="middle" class="tiny">VCC GND SDA SCL</text>
    <text x="595" y="342" text-anchor="middle" class="micro">VCC -&gt; 3V3</text>
    <text x="595" y="356" text-anchor="middle" class="micro">GND -&gt; GND</text>
    <text x="595" y="370" text-anchor="middle" class="micro">SDA -&gt; GPIO21</text>
    <text x="595" y="384" text-anchor="middle" class="micro">SCL -&gt; GPIO22</text>
    <circle class="pin" cx="535" cy="262" r="5"/>
    <circle class="pin" cx="675" cy="286" r="5"/>
    <circle class="pin" cx="515" cy="292" r="5"/>
    <circle class="pin" cx="515" cy="316" r="5"/>

    <rect class="module-muted" x="560" y="400" width="120" height="58" rx="12"/>
    <circle class="pin" cx="560" cy="429" r="5"/>
    <circle class="pin" cx="680" cy="429" r="5"/>
    <text x="620" y="426" text-anchor="middle" class="small">OK</text>
    <text x="620" y="442" text-anchor="middle" class="micro">GPIO18 + GND</text>

    <rect class="module-muted" x="560" y="490" width="120" height="58" rx="12"/>
    <circle class="pin" cx="560" cy="519" r="5"/>
    <circle class="pin" cx="680" cy="519" r="5"/>
    <text x="620" y="516" text-anchor="middle" class="small">Next</text>
    <text x="620" y="532" text-anchor="middle" class="micro">GPIO19 + GND</text>

    <rect class="module-muted" x="560" y="580" width="120" height="58" rx="12"/>
    <circle class="pin" cx="560" cy="609" r="5"/>
    <circle class="pin" cx="680" cy="609" r="5"/>
    <text x="620" y="606" text-anchor="middle" class="small">Back</text>
    <text x="620" y="622" text-anchor="middle" class="micro">GPIO23 + GND</text>

    <rect class="module-cool" x="510" y="690" width="170" height="120" rx="14"/>
    <text x="595" y="718" text-anchor="middle" class="label">RGB Module</text>
    <text x="595" y="738" text-anchor="middle" class="tiny">Common cathode</text>
    <text x="595" y="754" text-anchor="middle" class="micro">R -&gt; GPIO25</text>
    <text x="595" y="768" text-anchor="middle" class="micro">G -&gt; GPIO26</text>
    <text x="595" y="782" text-anchor="middle" class="micro">B -&gt; GPIO27</text>
    <text x="595" y="796" text-anchor="middle" class="micro">Common -&gt; GND</text>
    <circle class="pin" cx="510" cy="728" r="5"/>
    <circle class="pin" cx="510" cy="748" r="5"/>
    <circle class="pin" cx="510" cy="768" r="5"/>
    <circle class="pin" cx="680" cy="748" r="5"/>
    <circle cx="560" cy="792" r="12" fill="#ef4444"/>
    <circle cx="595" cy="792" r="12" fill="#22c55e"/>
    <circle cx="630" cy="792" r="12" fill="#3b82f6"/>

    <rect class="module-warm" x="515" y="820" width="165" height="72" rx="14"/>
    <text x="598" y="842" text-anchor="middle" class="label">Buzzer</text>
    <text x="598" y="858" text-anchor="middle" class="micro">SIG -&gt; GPIO14</text>
    <text x="598" y="870" text-anchor="middle" class="micro">VCC -&gt; 3V3, GND -&gt; GND</text>
    <text x="598" y="882" text-anchor="middle" class="micro">active-low</text>
    <circle class="pin" cx="515" cy="834" r="5"/>
    <circle class="pin" cx="515" cy="844" r="5"/>
    <circle class="pin" cx="680" cy="868" r="5"/>

    <rect class="module-mid" x="90" y="754" width="230" height="130" rx="14"/>
    <text x="205" y="784" text-anchor="middle" class="label">CP2102</text>
    <text x="205" y="804" text-anchor="middle" class="tiny">Deployment mode to target Linux host</text>
    <text x="205" y="820" text-anchor="middle" class="micro">TXD -&gt; GPIO16 (RX2)</text>
    <text x="205" y="834" text-anchor="middle" class="micro">RXD -&gt; GPIO17 (TX2)</text>
    <text x="205" y="848" text-anchor="middle" class="micro">GND -&gt; GND, USB -&gt; Linux host</text>
    <text x="118" y="864" class="tiny">TXD</text>
    <text x="170" y="864" class="tiny">RXD</text>
    <text x="224" y="864" class="tiny">GND</text>
    <text x="278" y="864" class="tiny">USB</text>
    <circle class="pin" cx="130" cy="874" r="5"/>
    <circle class="pin" cx="184" cy="874" r="5"/>
    <circle class="pin" cx="238" cy="874" r="5"/>
    <circle class="pin" cx="292" cy="874" r="5"/>

    <rect class="note" x="336" y="796" width="132" height="58" rx="10"/>
    <text x="402" y="820" text-anchor="middle" class="small">Linux Host</text>
    <text x="402" y="840" text-anchor="middle" class="micro">USB serial helper</text>

    <rect class="warn" x="74" y="894" width="300" height="40" rx="10"/>
    <text x="224" y="920" text-anchor="middle" class="note-text">VCC / 5V / 3V3 not connected in deployment mode.</text>

    <path class="wire-power" d="M210 380 L140 380 L140 230 L490 230 L490 856"/>
    <path class="wire-power" d="M490 262 L515 262"/>
    <path class="wire-power" d="M490 844 L515 844"/>

    <path class="wire-ground" d="M210 420 L116 420 L116 252 L710 252 L710 878"/>
    <path class="wire-ground" d="M710 286 L675 286"/>
    <path class="wire-ground" d="M710 429 L680 429"/>
    <path class="wire-ground" d="M710 519 L680 519"/>
    <path class="wire-ground" d="M710 609 L680 609"/>
    <path class="wire-ground" d="M710 748 L680 748"/>
    <path class="wire-ground" d="M710 868 L680 868"/>
    <path class="wire-ground" d="M238 874 L238 878 L710 878"/>

    <path class="wire-i2c" d="M210 460 L158 460 L158 292 L515 292"/>
    <path class="wire-i2c" d="M210 500 L172 500 L172 316 L515 316"/>

    <path class="wire-gpio" d="M400 420 L460 420 L460 429 L560 429"/>
    <path class="wire-gpio" d="M400 470 L482 470 L482 519 L560 519"/>
    <path class="wire-gpio" d="M400 520 L504 520 L504 609 L560 609"/>

    <path class="wire-gpio" d="M400 580 L432 580 L432 728 L510 728"/>
    <path class="wire-gpio" d="M400 630 L454 630 L454 748 L510 748"/>
    <path class="wire-gpio" d="M400 680 L476 680 L476 768 L510 768"/>
    <path class="wire-gpio" d="M210 620 L190 620 L190 780 L500 780 L500 834 L515 834"/>

    <path class="wire-uart2" d="M130 874 L130 736 L150 736 L150 540 L210 540"/>
    <path class="wire-uart2" d="M184 874 L184 758 L168 758 L168 580 L210 580"/>
    <path class="wire-usb" d="M292 874 L330 874 L330 825 L336 825"/>
  </g>

  <g id="flash-panel">
    <rect class="panel" x="820" y="110" width="740" height="840" rx="20"/>
    <text x="850" y="154" class="panel-title">Fallback Flash Mode</text>
    <text x="850" y="180" class="panel-subtitle">Use only if the ESP32 board USB path cannot flash or debug the board.</text>

    <rect class="board" x="850" y="215" width="680" height="700" rx="18"/>
    <line x1="1170" y1="240" x2="1170" y2="890" stroke="#e5e7eb" stroke-width="8"/>
    <line x1="1178" y1="240" x2="1178" y2="890" stroke="#e5e7eb" stroke-width="8"/>

    <rect class="module-dark" x="1030" y="270" width="180" height="470" rx="18"/>
    <text x="1120" y="308" text-anchor="middle" class="label" fill="#f8fafc">ESP32 Dev Board</text>
    <text x="1120" y="332" text-anchor="middle" class="small" fill="#e2e8f0">Preferred path is still the board USB</text>
    <rect x="1066" y="352" width="108" height="128" rx="8" fill="#1f2937" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="1120" y="420" text-anchor="middle" class="small" fill="#dbeafe">ESP32-WROOM-32</text>
    <rect x="1085" y="680" width="70" height="28" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1120" y="699" text-anchor="middle" class="tiny" fill="#f8fafc">USB</text>

    <circle class="pin" cx="1030" cy="380" r="5"/>
    <circle class="pin" cx="1030" cy="422" r="5"/>
    <circle class="pin" cx="1210" cy="380" r="5"/>
    <circle class="pin" cx="1210" cy="422" r="5"/>
    <circle class="pin" cx="1210" cy="464" r="5"/>

    <text x="1000" y="384" text-anchor="end" class="tiny">GPIO3 / U0RXD</text>
    <text x="1000" y="426" text-anchor="end" class="tiny">GND</text>
    <text x="1240" y="384" class="tiny">GPIO1 / U0TXD</text>
    <text x="1240" y="426" class="tiny">BOOT</text>
    <text x="1240" y="468" class="tiny">EN / RESET</text>

    <rect class="module-mid" x="920" y="760" width="250" height="126" rx="14"/>
    <text x="1045" y="790" text-anchor="middle" class="label">CP2102</text>
    <text x="1045" y="810" text-anchor="middle" class="tiny">Flash/debug fallback on UART0</text>
    <text x="1045" y="826" text-anchor="middle" class="micro">TXD -&gt; GPIO3 (U0RXD)</text>
    <text x="1045" y="840" text-anchor="middle" class="micro">RXD -&gt; GPIO1 (U0TXD)</text>
    <text x="1045" y="854" text-anchor="middle" class="micro">GND -&gt; GND</text>
    <text x="960" y="866" class="tiny">TXD</text>
    <text x="1010" y="866" class="tiny">RXD</text>
    <text x="1064" y="866" class="tiny">GND</text>
    <text x="1118" y="866" class="tiny">USB</text>
    <circle class="pin" cx="968" cy="874" r="5"/>
    <circle class="pin" cx="1022" cy="874" r="5"/>
    <circle class="pin" cx="1076" cy="874" r="5"/>
    <circle class="pin" cx="1130" cy="874" r="5"/>

    <rect class="note" x="1188" y="782" width="132" height="62" rx="10"/>
    <text x="1254" y="806" text-anchor="middle" class="small">PC / PlatformIO</text>
    <text x="1254" y="826" text-anchor="middle" class="micro">USB for flash/debug</text>

    <rect class="note" x="1235" y="300" width="250" height="86" rx="12"/>
    <text x="1360" y="328" text-anchor="middle" class="label">Manual bootloader</text>
    <text x="1256" y="352" class="note-text">1. Hold BOOT</text>
    <text x="1256" y="372" class="note-text">2. Tap EN / RESET</text>
    <text x="1256" y="392" class="note-text">3. Start upload</text>

    <rect class="warn" x="1235" y="430" width="250" height="76" rx="12"/>
    <text x="1360" y="458" text-anchor="middle" class="label">Mode switch rule</text>
    <text x="1256" y="482" class="note-text">Remove power and USB before</text>
    <text x="1256" y="502" class="note-text">moving CP2102 back to GPIO16/17.</text>

    <rect class="note" x="1235" y="560" width="250" height="96" rx="12"/>
    <text x="1360" y="588" text-anchor="middle" class="label">What is not shown here</text>
    <text x="1256" y="612" class="note-text">OLED, buttons, RGB, and buzzer</text>
    <text x="1256" y="632" class="note-text">stay wired the same on the breadboard.</text>
    <text x="1256" y="652" class="note-text">Only the CP2102 UART wires move.</text>

    <path class="wire-uart0" d="M968 874 L968 720 L1030 720 L1030 380"/>
    <path class="wire-uart0" d="M1022 874 L1022 740 L1210 740 L1210 380"/>
    <path class="wire-ground" d="M1076 874 L1076 760 L1030 760 L1030 422"/>
    <path class="wire-usb" d="M1130 874 L1160 874 L1160 813 L1188 813"/>
  </g>

  <g id="legend">
    <rect class="panel" x="40" y="970" width="1520" height="80" rx="18"/>
    <text x="70" y="1016" class="label">Legend</text>

    <line x1="160" y1="1008" x2="210" y2="1008" class="wire-power"/>
    <text x="224" y="1013" class="legend-label">3V3</text>

    <line x1="290" y1="1008" x2="340" y2="1008" class="wire-ground"/>
    <text x="354" y="1013" class="legend-label">GND</text>

    <line x1="420" y1="1008" x2="470" y2="1008" class="wire-i2c"/>
    <text x="484" y="1013" class="legend-label">I2C SDA / SCL</text>

    <line x1="610" y1="1008" x2="660" y2="1008" class="wire-gpio"/>
    <text x="674" y="1013" class="legend-label">GPIO control</text>

    <line x1="810" y1="1008" x2="860" y2="1008" class="wire-uart2"/>
    <text x="874" y="1013" class="legend-label">UART2 deployment</text>

    <line x1="1060" y1="1008" x2="1110" y2="1008" class="wire-uart0"/>
    <text x="1124" y="1013" class="legend-label">UART0 flash fallback</text>

    <line x1="1280" y1="1008" x2="1330" y2="1008" class="wire-usb"/>
    <text x="1344" y="1013" class="legend-label">USB link</text>

    <line x1="1430" y1="1008" x2="1480" y2="1008" class="wire-disabled"/>
    <text x="1494" y="1013" class="legend-label">reserved / not used</text>
  </g>
</svg>
